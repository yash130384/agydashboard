<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCARS Dev-Team Report Form</title>
    <style>
        :root {
            --lcars-blue-1: #007fff;
            --lcars-blue-2: #00bfff;
            --lcars-blue-3: #80d0ff;
            --lcars-purple-1: #a060c0;
            --lcars-purple-2: #c080e0;
            --lcars-purple-3: #e0c0f0;
            --lcars-orange-1: #ff9900;
            --lcars-orange-2: #ffb347;
            --lcars-orange-3: #ffd580;
            --lcars-red-1: #ff3300;
            --lcars-red-2: #ff6647;
            --lcars-red-3: #ff9980;
            --lcars-white: #ffffff;
            --lcars-black: #000000;
            --lcars-gray-1: #333333;
            --lcars-gray-2: #666666;
            --lcars-gray-3: #999999;
            --lcars-font-primary: 'LCARS', 'Arial Narrow', sans-serif;
        }

        body {
            font-family: var(--lcars-font-primary);
            background-color: var(--lcars-black);
            color: var(--lcars-white);
            margin: 0;
            padding: 20px;
            background-image: 
                linear-gradient(to right, rgba(0, 127, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 127, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--lcars-blue-1);
            padding: 20px;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 1px solid var(--lcars-blue-1);
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            color: var(--lcars-blue-1);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--lcars-blue-2);
            font-size: 18px;
        }

        input[type="text"], 
        textarea, 
        select {
            width: 100%;
            padding: 10px;
            background-color: var(--lcars-gray-1);
            border: 1px solid var(--lcars-blue-3);
            color: var(--lcars-white);
            font-family: var(--lcars-font-primary);
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 10px 20px;
            font-family: var(--lcars-font-primary);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            background-color: var(--lcars-blue-1);
            color: var(--lcars-black);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--lcars-blue-2);
            transform: scale(1.05);
        }

        button[type="reset"] {
            background-color: var(--lcars-gray-2);
            color: var(--lcars-white);
        }

        button[type="reset"]:hover {
            background-color: var(--lcars-gray-3);
        }

        .notification {
            padding: 15px;
            margin: 20px 0;
            border: 1px solid;
            display: none;
        }

        .notification.success {
            background-color: rgba(0, 255, 0, 0.1);
            border-color: #0f0;
            color: #0f0;
        }

        .notification.error {
            background-color: rgba(255, 0, 0, 0.1);
            border-color: #f00;
            color: #f00;
        }

        .lcars-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--lcars-blue-1);
        }

        .lcars-title {
            font-size: 24px;
            color: var(--lcars-blue-1);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .lcars-corner {
            width: 40px;
            height: 40px;
            border-top: 2px solid var(--lcars-blue-1);
            border-left: 2px solid var(--lcars-blue-1);
        }

        .lcars-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid var(--lcars-blue-1);
        }

        .lcars-corner-bottom {
            width: 40px;
            height: 40px;
            border-bottom: 2px solid var(--lcars-blue-1);
            border-right: 2px solid var(--lcars-blue-1);
        }

        .lcars-button-bar {
            display: flex;
            gap: 10px;
        }

        .lcars-button-small {
            width: 30px;
            height: 30px;
            background-color: var(--lcars-purple-1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lcars-header">
            <div class="lcars-corner"></div>
            <div class="lcars-title">DEV-TEAM REPORT</div>
            <div class="lcars-button-bar">
                <div class="lcars-button-small"></div>
                <div class="lcars-button-small"></div>
            </div>
        </div>

        <h1>Problem melden</h1>
        
        <div id="notification" class="notification"></div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="title">Titel *</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="body">Beschreibung / Fehlerbild *</label>
                <textarea id="body" name="body" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="component">Betroffene Komponente *</label>
                <select id="component" name="component" required>
                    <option value="">Bitte wählen...</option>
                    <option value="agydashboard">agydashboard</option>
                    <option value="9router">9router</option>
                    <option value="hermes">hermes</option>
                    <option value="system">system</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="urgency">Dringlichkeit *</label>
                <select id="urgency" name="urgency" required>
                    <option value="">Bitte wählen...</option>
                    <option value="low">Niedrig</option>
                    <option value="medium">Mittel</option>
                    <option value="high">Hoch</option>
                </select>
            </div>
            
            <div class="button-group">
                <button type="reset">Zurücksetzen</button>
                <button type="submit">Senden</button>
            </div>
        </form>
        
        <div class="lcars-footer">
            <div class="lcars-button-bar">
                <div class="lcars-button-small"></div>
                <div class="lcars-button-small"></div>
            </div>
            <div class="lcars-corner-bottom"></div>
        </div>
    </div>

    <script>
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('title').value,
                body: document.getElementById('body').value,
                component: document.getElementById('component').value,
                urgency: document.getElementById('urgency').value
            };
            
            const notification = document.getElementById('notification');
            
            fetch('/api/devteam/report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    notification.className = 'notification success';
                    notification.textContent = 'Problem erfolgreich gemeldet!';
                    notification.style.display = 'block';
                    document.getElementById('reportForm').reset();
                } else {
                    notification.className = 'notification error';
                    notification.textContent = 'Fehler beim Senden: ' + data.error;
                    notification.style.display = 'block';
                }
            })
            .catch(error => {
                notification.className = 'notification error';
                notification.textContent = 'Netzwerkfehler: ' + error.message;
                notification.style.display = 'block';
            });
        });
    </script>
</body>
</html>
